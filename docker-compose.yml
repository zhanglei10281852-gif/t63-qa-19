services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SANITATION_HTTP_ADDRESS: ":8653"
      SANITATION_DATABASE_URL: "file:/var/lib/sanitation/sanitation.db"
      SANITATION_ALLOWED_ORIGINS: "http://localhost:5173"
      SANITATION_WORKER_INTERVAL: "5"
      SANITATION_BOOTSTRAP_ADMIN_USERNAME: "admin"
      SANITATION_BOOTSTRAP_ADMIN_PASSWORD: "local-admin-only"
      SANITATION_BOOTSTRAP_ADMIN_NAME: "Local Administrator"
    ports:
      - "8653:8653"
    volumes:
      - sanitation-data:/var/lib/sanitation
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: "http://backend:8653"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sanitation-data:
